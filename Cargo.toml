[package]
name = "finance_logger"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
structopt = { version = "0.3.26", features = ["color"] }
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
yfinance-rs = "0.9.1"

[dev-dependencies]
mockito = "1.7.2"
quickcheck = "1.1.0"
